name: Production health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify production API and score synchronization
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 10 \
            https://kiniela-mundial-2026.netlify.app/api/health
